<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SafeKey</title>
  <style>
    body {
      width: 260px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 14px;
      color: #1f2430;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 10px;
    }
    label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      margin-bottom: 10px;
    }
    #domains {
      font-size: 12px;
      color: #555;
      max-height: 100px;
      overflow-y: auto;
    }
    .domain-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 0;
    }
    .domain-row button {
      border: none;
      background: none;
      color: #e5484d;
      cursor: pointer;
      font-size: 12px;
    }
    hr {
      border: none;
      border-top: 1px solid #eee;
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <h1>🔐 SafeKey</h1>
  <label>
    <input type="checkbox" id="enabled" />
    Enabled (warn about possible credentials)
  </label>
  <label>
    <input type="checkbox" id="blockSending" />
    Block sending until confirmed (Enter / forms)
  </label>
  <hr />
  <div><strong>Muted sites:</strong></div>
  <div id="domains"></div>
  <script src="popup.js"></script>
</body>
</html>
